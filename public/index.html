<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="/style.css">

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
</head>

<body>

    <h3 id="location-display">Victoria</h3>

    <h1 id="current-weather-display">☀️ 14°</h1>
    <h3 id="today-temperature-display">20° | 8°</h3>

    <div id="chat-window">Connecting...</div>

    <div class="input-group">
        <button onclick="requireWeatherData()" id="AIrequest">Request Current Weather</button>
        <button onclick="switchUnits()" id="unitsButton">°C</button>
        <input id="location-input" type="text">
        <button id="search-button" onclick="searchLocation()">Search</button>
        <button id="current-location-button" onclick="backToCurrentLocation()">Current Location</button>
    </div>
    <div id="place-selection-bar"></div>

    <div Id="sevenDayForecastBox">
        <h3>Seven day forecast:</h3>
        <div id="seven-day-forecast">
            <div class="daybox" id="daybox0">0</div>
            <div class="daybox" id="daybox1">1</div>
            <div class="daybox" id="daybox2">2</div>
            <div class="daybox" id="daybox3">3</div>
            <div class="daybox" id="daybox4">4</div>
            <div class="daybox" id="daybox5">5</div>
            <div class="daybox" id="daybox6">6</div>
            <div class="daybox" id="refreshdaybox" onclick="getSevenDayForecast()">&#10227</div>
        </div>
    </div>

    <div id="map" style="height: 500px; width: 100%;"></div>
    <div id="layer-controls" style="margin-bottom: 10px;">
        <button onclick="changeWeatherLayer('temp_new')" class="btn btn-primary">Temperature</button>
        <button onclick="changeWeatherLayer('precipitation_new')" class="btn btn-primary">Precipitation</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>

</html>
