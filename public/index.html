<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
</head>

<body>
    <h3 id="location-display">Victoria</h3>
    <h1 id="current-weather-display">☀️ 14°</h1>
    <h3 id="today-temperature-display">20° | 8°</h3>

    <div id="searchbox">
        <input id="location-input" type="text" aria-label="Search">
        <button id="search-button" onclick="searchLocation()">Search</button>
        <button id="current-location-button" onclick="backToCurrentLocation()">Current Location</button>
    </div>
    <div id="place-selection-bar"></div>

    <br>

    <div id="sevenDayForecastBox">
        <span class="widget-header">&nbsp; &nbsp;7 day forecast:</span>
        <div class="scroll-container" id="removepadding">
            <div id="seven-day-forecast">
                <div class="daybox" id="daybox0">0</div>
                <div class="daybox" id="daybox1">1</div>
                <div class="daybox" id="daybox2">2</div>
                <div class="daybox" id="daybox3">3</div>
                <div class="daybox" id="daybox4">4</div>
                <div class="daybox" id="daybox5">5</div>
                <div class="daybox" id="daybox6">6</div>
            </div>
        </div>
    </div>

    <br>

    <div class="weather-widget">
        <div class="widget-header">
            <span>24-hour forecast</span>
        </div>

        <div class="scroll-container" id="hourlyForecastBox">

            <div class="forecast-item">
                <span class="temp">12°</span>
                <span class="icon">⛅</span>
                <span class="wind">0.5 m/s</span>
                <span class="time">Now</span>
            </div>

            <div class="forecast-item">
                <span class="temp">13°</span>
                
                <span class="icon">🌧️</span>
                <span class="wind">1.9 m/s</span>
                <span class="time">10:00</span>
            </div>

            <div class="forecast-item">
                <span class="temp">14°</span>
                
                <span class="icon">⛅</span>
                <span class="wind">2.6 m/s</span>
                <span class="time">11:00</span>
            </div>

            <div class="forecast-item">
                <span class="temp">14°</span>
                
                <span class="icon">⛅</span>
                <span class="wind">2.6 m/s</span>
                <span class="time">12:00</span>
            </div>

            <div class="forecast-item">
                <span class="temp">14°</span>
                
                <span class="icon">⛅</span>
                <span class="wind">2.3 m/s</span>
                <span class="time">13:00</span>
            </div>

            <div class="forecast-item">
                <span class="temp">15°</span>
                
                <span class="icon">⛅</span>
                <span class="wind">2.3 m/s</span>
                <span class="time">14:00</span>
            </div>
        </div>
    </div>

    <br>

    <div id="chat-window">Connecting...</div>

    <div class="input-group">
        <button onclick="requireWeatherData()" id="AIrequest">Request Current Weather</button>
        <button onclick="switchUnits()" id="unitsButton">°C</button>
    </div>

    <br>

    <div id="map" style="height: 500px; width: 100%;"></div>
    <div id="layer-controls" style="margin-bottom: 10px;">
        <button onclick="changeWeatherLayer('temp_new')" class="btn btn-primary" id="tempbtn">Temperature</button>
        <button onclick="changeWeatherLayer('precipitation_new')" class="btn btn-primary"
            id="rainbtn">Precipitation</button>
    </div>

    <br>

    <button type="button" id="installButton" style="display: none;">Install App</button>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>

</html>
